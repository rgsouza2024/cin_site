name: Verificar links

# Varre mensalmente todos os links externos catalogados nos dados do site
# (portal do CJF em sua maioria). Se algum quebrar — o CMS do portal muda
# slugs sem redirecionamento —, o workflow fica vermelho e aponta quais.

on:
  schedule:
    - cron: "0 13 1 * *" # dia 1 de cada mês, 10h de Brasília
  workflow_dispatch:

# Menor privilégio: este workflow só lê o repositório
permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar links externos
        run: npm run verificar-links
